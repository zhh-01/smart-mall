<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>验证码登录 | 寻羽小市</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="account-page">
    <header class="site-header"><a class="brand" href="index.html#top" aria-label="返回寻羽小市首页"><img src="assets/logo.png" alt="寻羽小市" /></a><nav class="main-nav" aria-label="页面导航"><a href="index.html">首页</a><a href="products.html">全部商品</a><a href="messages.html">消息中心</a><a class="active" href="login.html">登录</a></nav><div class="header-actions"><a class="home-link" href="index.html">返回首页</a></div></header>
    <main class="auth-single-layout"><section class="auth-panel"><p class="eyebrow">QUICK SIGN IN</p><h1>验证码登录</h1><p class="auth-intro">使用手机号和验证码快速登录寻羽小市。</p><form id="code-form"><label for="code-phone">手机号</label><input id="code-phone" type="tel" placeholder="输入手机号" required /><label for="login-code">验证码</label><input id="login-code" type="text" inputmode="numeric" placeholder="请输入 6 位验证码" required minlength="6" maxlength="6" /><p class="form-error" id="code-error" role="alert"></p><button class="checkout-button" type="submit">验证码登录 <span>→</span></button><small class="code-hint">演示验证码：123456</small></form><a class="auth-back-link" href="login.html">返回登录</a></section></main>
    <script src="code-login.js"></script>
  </body>
